name: Update Profile SVGs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate Profile SVGs & README
        run: |
          python generate_profile.py --username Niveditagupta03 --repo Niveditagupta03

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chroma: Auto-update profile SVGs [skip ci]"
          file_pattern: "*.svg README.md"
