<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829"/>
      <stop offset="50%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="arch-border" x1="0%" y1="0%" x2="100%" y2="100%">
    <linearGradient id="pillar-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="pillar-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="pillar-grad-0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <style>
    .hud-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #f0f6fc; font-weight: 700; letter-spacing: 1px; }
    .hud-sub { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #00f0ff; font-weight: 600; }
    .card-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; font-weight: bold; fill: #f0f6fc; }
    .card-desc { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #8b949e; }
  </style>

  <rect x="2" y="2" width="436" height="436" rx="14" fill="url(#arch-bg)" stroke="url(#arch-border)" stroke-width="1.5"/>

  <g transform="translate(20, 26)">
    <text x="0" y="0" class="hud-title">// FEATURED SYSTEM PILLARS</text>
    <text x="400" y="0" class="hud-sub" text-anchor="end">SYS://SHOWCASE</text>
  </g>
  <line x1="20" y1="36" x2="420" y2="36" stroke="#1f293d" stroke-width="1"/>

  <g transform="translate(20, 55)">
    <g opacity="0">
      <rect x="0" y="0" width="400" height="98" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="98" rx="2" fill="url(#pillar-grad-0)"/>
      <text x="20" y="30" class="card-title">🤖 AI & AGENTIC SYSTEMS</text>
      <text x="20" y="58" class="card-desc">Autonomous Workflows • Multi-Agent • LLMs</text>
      <rect x="20" y="74" width="360" height="3" rx="1.5" fill="url(#pillar-grad-0)" opacity="0.6"/>
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.25s" begin="0.15s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="0" y="115" width="400" height="98" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
      <rect x="0" y="115" width="5" height="98" rx="2" fill="url(#pillar-grad-1)"/>
      <text x="20" y="145" class="card-title">⚡ HIGH-PERFORMANCE WEB</text>
      <text x="20" y="173" class="card-desc">React • Next.js • Tailwind • Glassmorphic UI</text>
      <rect x="20" y="189" width="360" height="3" rx="1.5" fill="url(#pillar-grad-1)" opacity="0.6"/>
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.25s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.25s" begin="0.25s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="0" y="230" width="400" height="98" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
      <rect x="0" y="230" width="5" height="98" rx="2" fill="url(#pillar-grad-2)"/>
      <text x="20" y="260" class="card-title">☁️ DISTRIBUTED & CLOUD</text>
      <text x="20" y="288" class="card-desc">Python FastAPI • Docker • Microservices • CI/CD</text>
      <rect x="20" y="304" width="360" height="3" rx="1.5" fill="url(#pillar-grad-2)" opacity="0.6"/>
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.25s" begin="0.35s" fill="freeze"/>
    </g>
  </g>
</svg>