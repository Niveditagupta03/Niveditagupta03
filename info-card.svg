  <!-- Header -->
  <g transform="translate(20, 26)">
    <text x="0" y="0" class="hud-title">CONSTELLATION TELEMETRY HUD</text>
    <text x="400" y="0" class="hud-title" text-anchor="end" fill="#ff007f">✦ NODE-X</text>
  </g>
  <line x1="20" y1="36" x2="420" y2="36" stroke="#1f293d" stroke-width="1"/>

  <!-- SECTION 1: CONSTELLATION NODES -->
  <g transform="translate(20, 55)">
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="-3" r="3.5" fill="#ffb800" filter="url(#node-glow)"/>
      <line x1="16" y1="-3" x2="35" y2="-3" stroke="#ffb800" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="0" class="info-key" fill="#ffb800">PILOT   :</text>
      <text x="125" y="0" class="info-val">Niveditagupta03</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.12s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.12s" fill="freeze"/>
    </g>
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="21" r="3.5" fill="#00f0ff" filter="url(#node-glow)"/>
      <line x1="16" y1="21" x2="35" y2="21" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="24" class="info-key" fill="#00f0ff">ROLE    :</text>
      <text x="125" y="24" class="info-val">Full-Stack &amp; Systems Architect</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.17s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.17s" fill="freeze"/>
    </g>
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="45" r="3.5" fill="#00ff88" filter="url(#node-glow)"/>
      <line x1="16" y1="45" x2="35" y2="45" stroke="#00ff88" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="48" class="info-key" fill="#00ff88">STATION :</text>
      <text x="125" y="48" class="info-val">CyberOS Space Node 01</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.22s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.22s" fill="freeze"/>
    </g>
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="69" r="3.5" fill="#ff007f" filter="url(#node-glow)"/>
      <line x1="16" y1="69" x2="35" y2="69" stroke="#ff007f" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="72" class="info-key" fill="#ff007f">TECH    :</text>
      <text x="125" y="72" class="info-val">Python • TypeScript • React • AI</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.27s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.27s" fill="freeze"/>
    </g>
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="93" r="3.5" fill="#a371f7" filter="url(#node-glow)"/>
      <line x1="16" y1="93" x2="35" y2="93" stroke="#a371f7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="96" class="info-key" fill="#a371f7">DEVOPS  :</text>
      <text x="125" y="96" class="info-val">Docker • Kubernetes • AWS</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.32s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.32s" fill="freeze"/>
    </g>
    <g opacity="0">
      <!-- Glowing Node Point -->
      <circle cx="6" cy="117" r="3.5" fill="#00ff88" filter="url(#node-glow)"/>
      <line x1="16" y1="117" x2="35" y2="117" stroke="#00ff88" stroke-opacity="0.5" stroke-width="1"/>
      <text x="42" y="120" class="info-key" fill="#00ff88">STATUS  :</text>
      <text x="125" y="120" class="info-val">EXPLORING THE FUTURE</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.37s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.37s" fill="freeze"/>
    </g>
  </g>

  <!-- SECTION 2: TELEMETRY CIRCULAR RINGS -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" class="section-lbl">// SYSTEM ACTIVITY RINGS</text>
  </g>

  <!-- Concentric Circular Telemetry Rings -->
  <g>
    <!-- Outer Ring: Velocity (95%) -->
    <circle cx="110" cy="325" r="65" fill="none" stroke="#1f293d" stroke-width="8"/>
    <circle cx="110" cy="325" r="65" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="408" stroke-dashoffset="408" stroke-linecap="round" transform="rotate(-90 110 325)">
      <animate attributeName="stroke-dashoffset" values="408; 20" dur="1.2s" begin="0.4s" fill="freeze"/>
    </circle>

    <!-- Middle Ring: Uptime (99%) -->
    <circle cx="110" cy="325" r="48" fill="none" stroke="#1f293d" stroke-width="8"/>
    <circle cx="110" cy="325" r="48" fill="none" stroke="#ff007f" stroke-width="8" stroke-dasharray="301" stroke-dashoffset="301" stroke-linecap="round" transform="rotate(-90 110 325)">
      <animate attributeName="stroke-dashoffset" values="301; 5" dur="1.2s" begin="0.55s" fill="freeze"/>
    </circle>

    <!-- Inner Ring: AI Power (90%) -->
    <circle cx="110" cy="325" r="31" fill="none" stroke="#1f293d" stroke-width="8"/>
    <circle cx="110" cy="325" r="31" fill="none" stroke="#ffb800" stroke-width="8" stroke-dasharray="194" stroke-dashoffset="194" stroke-linecap="round" transform="rotate(-90 110 325)">
      <animate attributeName="stroke-dashoffset" values="194; 20" dur="1.2s" begin="0.7s" fill="freeze"/>
    </circle>
  </g>

  <!-- Ring Legend Entries -->
  <g transform="translate(200, 285)">
    <g>
      <circle cx="8" cy="0" r="5" fill="#00f0ff"/>
      <text x="20" y="4" class="ring-lbl">CODE VELOCITY</text>
      <text x="180" y="4" class="ring-pct" text-anchor="end">95%</text>
    </g>
    <g transform="translate(0, 32)">
      <circle cx="8" cy="0" r="5" fill="#ff007f"/>
      <text x="20" y="4" class="ring-lbl">SYSTEM UPTIME</text>
      <text x="180" y="4" class="ring-pct" fill="#ff007f" text-anchor="end">99.9%</text>
    </g>
    <g transform="translate(0, 64)">
      <circle cx="8" cy="0" r="5" fill="#ffb800"/>
      <text x="20" y="4" class="ring-lbl">AI ENGINEERING</text>
      <text x="180" y="4" class="ring-pct" fill="#ffb800" text-anchor="end">92%</text>
