  </circle>
  <circle cx="135" cy="99" r="1.6" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="376" cy="235" r="0.7" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="101" cy="143" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
