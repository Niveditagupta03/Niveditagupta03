  <circle cx="218" cy="95" r="1.1" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="146" r="1.2" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="31" cy="319" r="1.4" fill="#ffffff" opacity="0.3">
