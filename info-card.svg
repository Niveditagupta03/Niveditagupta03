  </circle>
  <circle cx="121" cy="316" r="1.0" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="142" cy="379" r="1.3" fill="#ffffff" opacity="0.3">
