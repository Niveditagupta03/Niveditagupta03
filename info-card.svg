    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="402" cy="155" r="1.4" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="417" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="344" cy="267" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.8s" repeatCount="indefinite"/>
