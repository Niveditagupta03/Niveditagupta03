<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <linearGradient id="info-bg-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050812" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="info-hud-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
    <linearGradient id="skill-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>
    <linearGradient id="skill-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="skill-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="skill-grad-0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <style>
    .info-header { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: bold; }
    .section-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; font-weight: bold; fill: #8b949e; letter-spacing: 1px; }
    .info-key { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: bold; }
    .info-val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #c9d1d9; }
    .skill-label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: bold; fill: #f0f6fc; }
    .skill-pct { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: bold; fill: #00f0ff; }
  </style>

  <!-- Window Outer Frame -->
  <rect x="2" y="2" width="436" height="436" rx="12" fill="url(#info-bg-space)" stroke="url(#info-hud-border)" stroke-width="1.5"/>

  <!-- Cyber Corner HUD Accents -->
  <path d="M 6 18 L 6 6 L 18 6" fill="none" stroke="#ff007f" stroke-width="2"/>
  <path d="M 422 6 L 434 6 L 434 18" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 6 422 L 6 434 L 18 434" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 422 434 L 434 434 L 434 422" fill="none" stroke="#ff007f" stroke-width="2"/>

  <!-- Header Title: user@github-node -->
  <g transform="translate(22, 38)">
    <text class="info-header">
      <tspan fill="#ff007f">Niveditagupta03</tspan>
      <tspan fill="#f0f6fc">@</tspan>
      <tspan fill="#00f0ff">CYBER-NODE-X</tspan>
    </text>
    
    <!-- Multi-Segment Neofetch Accent Line -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="65" height="2" fill="#ff007f"/>
      <rect x="65" y="0" width="65" height="2" fill="#ffb800"/>
      <rect x="130" y="0" width="65" height="2" fill="#00ff66"/>
      <rect x="195" y="0" width="65" height="2" fill="#00f0ff"/>
      <rect x="260" y="0" width="65" height="2" fill="#a371f7"/>
      <rect x="325" y="0" width="70" height="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- SECTION 1: SYSTEM INFO -->
  <g transform="translate(22, 70)">
    <g opacity="0">
      <text x="0" y="0" class="info-key" fill="#ff007f">OS       :</text>
      <text x="95" y="0" class="info-val">CyberOS 2026.7 (x86_64)</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.12s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.12s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="22" class="info-key" fill="#ffb800">Host     :</text>
      <text x="95" y="22" class="info-val">GitHub Cloud Workstation</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.17s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.17s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="44" class="info-key" fill="#00ff66">Kernel   :</text>
      <text x="95" y="44" class="info-val">5.19.0-cyber-node-v6</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.22s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.22s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="66" class="info-key" fill="#00f0ff">Role     :</text>
      <text x="95" y="66" class="info-val">Senior Full-Stack &amp; Systems Dev</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.27s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.27s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="88" class="info-key" fill="#a371f7">Focus    :</text>
      <text x="95" y="88" class="info-val">AI Agents • High-Perf SVGs • WebApp</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.32s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.32s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="110" class="info-key" fill="#00ff66">Status   :</text>
      <text x="95" y="110" class="info-val">100% OPERATIONAL</text>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.37s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.2s" begin="0.37s" fill="freeze"/>
    </g>
  </g>

  <!-- SECTION 2: SKILL MATRIX BARS -->
  <g transform="translate(22, 220)">
    <text x="0" y="0" class="section-title">// TECH SKILL MATRIX</text>
  </g>
  <g transform="translate(22, 235)">
    <g opacity="0">
      <text x="0" y="0" class="skill-label">Python & AI Agents</text>
      <text x="395" y="0" class="skill-pct" text-anchor="end">95%</text>
      <!-- Background Bar Track -->
      <rect x="0" y="6" width="330" height="8" rx="4" fill="#141c2e"/>
      <!-- Animated Progress Bar -->
      <rect x="0" y="6" width="0" height="8" rx="4" fill="url(#skill-grad-0)">
        <animate attributeName="width" values="0; 318" dur="0.8s" begin="0.45s" fill="freeze"/>
      </rect>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.45s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="32" class="skill-label">TypeScript & React</text>
      <text x="395" y="32" class="skill-pct" text-anchor="end">92%</text>
      <!-- Background Bar Track -->
      <rect x="0" y="38" width="330" height="8" rx="4" fill="#141c2e"/>
      <!-- Animated Progress Bar -->
      <rect x="0" y="38" width="0" height="8" rx="4" fill="url(#skill-grad-1)">
        <animate attributeName="width" values="0; 310" dur="0.8s" begin="0.53s" fill="freeze"/>
      </rect>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.53s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="64" class="skill-label">System Architecture</text>
      <text x="395" y="64" class="skill-pct" text-anchor="end">88%</text>
      <!-- Background Bar Track -->
      <rect x="0" y="70" width="330" height="8" rx="4" fill="#141c2e"/>
      <!-- Animated Progress Bar -->
      <rect x="0" y="70" width="0" height="8" rx="4" fill="url(#skill-grad-2)">
        <animate attributeName="width" values="0; 301" dur="0.8s" begin="0.61s" fill="freeze"/>
      </rect>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.61s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="0" y="96" class="skill-label">Docker & Cloud Dev</text>
      <text x="395" y="96" class="skill-pct" text-anchor="end">85%</text>
      <!-- Background Bar Track -->
      <rect x="0" y="102" width="330" height="8" rx="4" fill="#141c2e"/>
      <!-- Animated Progress Bar -->
      <rect x="0" y="102" width="0" height="8" rx="4" fill="url(#skill-grad-3)">
        <animate attributeName="width" values="0; 294" dur="0.8s" begin="0.69s" fill="freeze"/>
      </rect>
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="0.69s" fill="freeze"/>
    </g>
  </g>

  <!-- Bottom Palette Swatches -->
  <g transform="translate(22, 398)">
    <rect x="0" y="0" width="42" height="12" rx="3" fill="#ff007f" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.5s" fill="freeze" transform-origin="21px 6px"/>
    </rect>
    <rect x="52" y="0" width="42" height="12" rx="3" fill="#ffb800" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.54s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.54s" fill="freeze" transform-origin="73px 6px"/>
    </rect>
    <rect x="104" y="0" width="42" height="12" rx="3" fill="#00ff66" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.58s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.58s" fill="freeze" transform-origin="125px 6px"/>
    </rect>
    <rect x="156" y="0" width="42" height="12" rx="3" fill="#00f0ff" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.62s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.62s" fill="freeze" transform-origin="177px 6px"/>
    </rect>
    <rect x="208" y="0" width="42" height="12" rx="3" fill="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.66s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.66s" fill="freeze" transform-origin="229px 6px"/>
    </rect>
    <rect x="260" y="0" width="42" height="12" rx="3" fill="#a371f7" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.7s" fill="freeze" transform-origin="281px 6px"/>
    </rect>
    <rect x="312" y="0" width="42" height="12" rx="3" fill="#f0f6fc" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.25s" begin="0.74s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.2; 1" keyTimes="0; 1" dur="0.25s" begin="0.74s" fill="freeze" transform-origin="333px 6px"/>
    </rect>
  </g>
</svg>