<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160">
  <defs>
    <linearGradient id="met-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829"/>
      <stop offset="50%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="met-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <style>
    .met-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: bold; fill: #8b949e; letter-spacing: 1px; }
    .met-val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f0f6fc; }
  </style>

  <rect x="2" y="2" width="876" height="156" rx="14" fill="url(#met-bg)" stroke="url(#met-border)" stroke-width="1.5"/>

  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="195" height="110" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#1f293d" stroke-width="6"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" transform="rotate(-90 45 55)">
      <animate attributeName="stroke-dashoffset" values="201; 10" dur="1.2s" begin="0.2s" fill="freeze"/>
    </circle>
    <text x="92" y="48" class="met-title">GLOBAL REPOSITORIES</text>
    <text x="92" y="70" class="met-val" fill="#00f0ff">100% Active</text>
  </g>
  <g transform="translate(235, 25)">
    <rect x="0" y="0" width="195" height="110" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#1f293d" stroke-width="6"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#ff007f" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" transform="rotate(-90 45 55)">
      <animate attributeName="stroke-dashoffset" values="201; 22" dur="1.2s" begin="0.30000000000000004s" fill="freeze"/>
    </circle>
    <text x="92" y="48" class="met-title">CODE VELOCITY</text>
    <text x="92" y="70" class="met-val" fill="#ff007f">95% Rating</text>
  </g>
  <g transform="translate(445, 25)">
    <rect x="0" y="0" width="195" height="110" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#1f293d" stroke-width="6"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#00ff88" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" transform="rotate(-90 45 55)">
      <animate attributeName="stroke-dashoffset" values="201; 2" dur="1.2s" begin="0.4s" fill="freeze"/>
    </circle>
    <text x="92" y="48" class="met-title">SYSTEM UPTIME</text>
    <text x="92" y="70" class="met-val" fill="#00ff88">99.9% Operational</text>
  </g>
  <g transform="translate(655, 25)">
    <rect x="0" y="0" width="195" height="110" rx="10" fill="#0d1424" stroke="#1f293d" stroke-width="1"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#1f293d" stroke-width="6"/>
    <circle cx="45" cy="55" r="32" fill="none" stroke="#ffb800" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" transform="rotate(-90 45 55)">
      <animate attributeName="stroke-dashoffset" values="201; 30" dur="1.2s" begin="0.5s" fill="freeze"/>
    </circle>
    <text x="92" y="48" class="met-title">AI WORKFLOWS</text>
    <text x="92" y="70" class="met-val" fill="#ffb800">92% Automated</text>
  </g>
</svg>