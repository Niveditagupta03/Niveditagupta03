<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <filter id="sun-aura" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge><feMergeNode in="blur1" /><feMergeNode in="blur2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="planet-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829"/>
      <stop offset="50%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="orbit-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>

  <style>
    .orbit-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #f0f6fc; font-weight: 700; letter-spacing: 1px; }
    .orbit-sub { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #00f0ff; font-weight: 600; }
    .planet-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: bold; fill: #ffffff; }
    .sun-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: bold; fill: #030712; }
  </style>

  <!-- Window Outer Frame -->
  <rect x="2" y="2" width="436" height="436" rx="14" fill="url(#space-bg)" stroke="url(#orbit-border)" stroke-width="1.5"/>

  <!-- Starfield -->
  <circle cx="406" cy="212" r="1.3" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="116" cy="115" r="1.3" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="234" cy="241" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="181" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="327" cy="401" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="182" r="1.1" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="396" cy="381" r="1.4" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="282" cy="142" r="1.4" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="267" cy="153" r="1.6" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="335" r="1.4" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="20" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="198" r="0.8" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="419" cy="349" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="172" cy="347" r="1.0" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="187" cy="250" r="1.6" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="193" cy="408" r="0.8" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="211" cy="215" r="1.2" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="193" cy="224" r="0.8" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="193" cy="191" r="0.8" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="181" cy="22" r="0.8" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="273" cy="214" r="1.2" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="162" cy="392" r="0.9" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="361" cy="270" r="1.6" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="349" cy="348" r="1.5" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="109" cy="355" r="1.2" fill="#ffffff" opacity="0.3">
    <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Header -->
  <g transform="translate(20, 26)">
    <text x="0" y="0" class="orbit-title">PLANETARY TECH ORBIT</text>
    <text x="400" y="0" class="orbit-sub" text-anchor="end">SYS://SOLAR_CORE</text>
  </g>
  <line x1="20" y1="36" x2="420" y2="36" stroke="#1f293d" stroke-width="1"/>

  <!-- Planetary Orbits & Revolving Satellites -->
  <!-- Orbit Ring 1 -->
  <circle cx="220" cy="230" r="75" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g transform="rotate(144.0 220 230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 220 230" to="360 220 230" dur="14s" repeatCount="indefinite"/>
      <!-- Planet Sphere -->
      <circle cx="295" cy="230" r="11" fill="#00f0ff" filter="url(#planet-glow)"/>
      <!-- Planet Label Badge -->
      <rect x="309" y="221" width="87.2" height="18" rx="4" fill="#0d1424" stroke="#00f0ff" stroke-width="1" opacity="0.9"/>
      <text x="313" y="233" class="planet-text">Python & AI</text>
    </g>
  </g>
  <!-- Orbit Ring 2 -->
  <circle cx="220" cy="230" r="125" fill="none" stroke="#ff007f" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g transform="rotate(251.99999999999997 220 230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 220 230" to="360 220 230" dur="22s" repeatCount="indefinite"/>
      <!-- Planet Sphere -->
      <circle cx="345" cy="230" r="11" fill="#ff007f" filter="url(#planet-glow)"/>
      <!-- Planet Label Badge -->
      <rect x="359" y="221" width="80.0" height="18" rx="4" fill="#0d1424" stroke="#ff007f" stroke-width="1" opacity="0.9"/>
      <text x="363" y="233" class="planet-text">TypeScript</text>
    </g>
  </g>
  <!-- Orbit Ring 3 -->
  <circle cx="220" cy="230" r="165" fill="none" stroke="#a371f7" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g transform="rotate(396.00000000000006 220 230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 220 230" to="360 220 230" dur="32s" repeatCount="indefinite"/>
      <!-- Planet Sphere -->
      <circle cx="385" cy="230" r="11" fill="#a371f7" filter="url(#planet-glow)"/>
      <!-- Planet Label Badge -->
      <rect x="399" y="221" width="87.2" height="18" rx="4" fill="#0d1424" stroke="#a371f7" stroke-width="1" opacity="0.9"/>
      <text x="403" y="233" class="planet-text">React & Web</text>
    </g>
  </g>

  <!-- Core Sun -->
  <circle cx="220" cy="230" r="32" fill="#ffb800" filter="url(#sun-aura)">
    <animate attributeName="r" values="30; 34; 30" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="230" r="28" fill="#ff9e3b"/>
  <text x="220" y="227" class="sun-text" text-anchor="middle">CORE</text>
  <text x="220" y="240" class="sun-text" text-anchor="middle" font-size="8px">Niveditagu</text>

  <!-- Footer Telemetry -->
  <g transform="translate(20, 415)">
    <text x="0" y="0" class="orbit-sub">✦ ORBITAL VELOCITY: OPTIMAL</text>
    <text x="400" y="0" class="orbit-sub" text-anchor="end">STATUS: 100% OPERATIONAL</text>
  </g>
</svg>